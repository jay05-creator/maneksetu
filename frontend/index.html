<!doctype html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><meta name="theme-color" content="#153b73"/><meta name="description" content="BIS Certinexus AI — Indian Standards, made understandable."/><title>BIS Certinexus AI</title></head><body><div id="root"></div><script>window.addEventListener('error',function(e){var r=document.getElementById('root');if(r&&!r.children.length){r.innerHTML='<pre id="startup-error" style="padding:24px;color:#8b1d1d;white-space:pre-wrap">Startup error: '+String(e.message)+'\n'+String(e.filename)+':'+String(e.lineno)+'</pre>'}});window.addEventListener('unhandledrejection',function(e){var r=document.getElementById('root');if(r&&!r.children.length){r.innerHTML='<pre id="startup-error" style="padding:24px;color:#8b1d1d;white-space:pre-wrap">Startup error: '+String(e.reason)+'</pre>'}})</script><script type="module" src="/src/main.tsx"></script></body></html>
